name: Buildora CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buildora
          POSTGRES_PASSWORD: buildora
          POSTGRES_DB: buildora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildora -d buildora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://buildora:buildora@localhost:5432/buildora?schema=public
      AUTH_SECRET: buildora_ci_only_secret_key_with_at_least_32_chars
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buildora
          POSTGRES_PASSWORD: buildora
          POSTGRES_DB: buildora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildora -d buildora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://buildora:buildora@localhost:5432/buildora?schema=public
      E2E_DATABASE_URL: postgresql://buildora:buildora@localhost:5432/buildora?schema=public
      AUTH_SECRET: buildora_ci_only_secret_key_with_at_least_32_chars
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
