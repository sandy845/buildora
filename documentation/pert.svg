  <path d="M155 119H177M320 119H342M485 119H507M650 119H672M815 119H837" class="link"/>
  <text x="500" y="205" text-anchor="middle" class="note">Assumed serial critical path: 18 expected weeks. Three-point durations are planning assumptions, not logged effort.</text>
  <text x="500" y="230" text-anchor="middle" class="note">PERT estimate per activity: (optimistic + 4 × most likely + pessimistic) ÷ 6.</text>
  <text x="500" y="255" text-anchor="middle" class="note">Parallel work, team size, academic deadlines and business review may change the schedule materially.</text>
</svg>
