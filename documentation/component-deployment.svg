  <rect x="775" y="190" width="190" height="58" rx="10" class="optional"/><text x="870" y="225" text-anchor="middle" class="small">Email provider (optional)</text>
  <rect x="775" y="275" width="190" height="58" rx="10" class="optional"/><text x="870" y="310" text-anchor="middle" class="small">S3 storage (optional)</text>
  <rect x="775" y="360" width="190" height="58" rx="10" class="optional"/><text x="870" y="395" text-anchor="middle" class="small">Firebase Admin (optional)</text>
