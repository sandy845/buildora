<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#36536b"/></marker>
    <style>
      .title{font:700 24px Arial;fill:#183247}.label{font:600 15px Arial;fill:#183247}
      .small{font:13px Arial;fill:#30495c}.box{fill:#eef4f7;stroke:#36536b;stroke-width:2}
      .life{stroke:#8193a0;stroke-width:2;stroke-dasharray:7 6}
      .msg{stroke:#36536b;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .opt{fill:#fff8e9;stroke:#b07b20;stroke-width:2}
    </style>
  </defs>
  <rect width="1000" height="610" fill="white"/>
  <text x="500" y="38" text-anchor="middle" class="title">Enquiry submission sequence</text>
  <rect x="30" y="62" width="130" height="48" rx="8" class="box"/><text x="95" y="92" text-anchor="middle" class="label">Visitor</text>
  <rect x="190" y="62" width="150" height="48" rx="8" class="box"/><text x="265" y="92" text-anchor="middle" class="label">Enquiry UI</text>
  <rect x="370" y="62" width="155" height="48" rx="8" class="box"/><text x="447" y="92" text-anchor="middle" class="label">Server action</text>
  <rect x="570" y="62" width="140" height="48" rx="8" class="box"/><text x="640" y="92" text-anchor="middle" class="label">PostgreSQL</text>
  <rect x="755" y="62" width="115" height="48" rx="8" class="box"/><text x="812" y="92" text-anchor="middle" class="label">Session</text>
  <rect x="890" y="62" width="100" height="48" rx="8" class="opt"/><text x="940" y="92" text-anchor="middle" class="small">Email*</text>
  <path d="M95 110 L95 555 M265 110 L265 555 M447 110 L447 555 M640 110 L640 555 M812 110 L812 555 M940 110 L940 555" class="life"/>
  <path d="M96 148 L256 148" class="msg"/><text x="176" y="139" text-anchor="middle" class="small">Submit form</text>
  <path d="M266 194 L438 194" class="msg"/><text x="352" y="185" text-anchor="middle" class="small">Payload</text>
  <path d="M447 240 L438 240" class="msg"/><text x="350" y="231" text-anchor="middle" class="small">Check rate limit + validate</text>
  <path d="M448 286 L632 286" class="msg"/><text x="540" y="277" text-anchor="middle" class="small">Create lead</text>
  <path d="M632 332 L455 332" class="msg"/><text x="544" y="323" text-anchor="middle" class="small">Lead ID</text>
  <path d="M448 378 L804 378" class="msg"/><text x="625" y="369" text-anchor="middle" class="small">Resolve current user</text>
  <path d="M804 424 L455 424" class="msg"/><text x="629" y="415" text-anchor="middle" class="small">Customer / unauthenticated</text>
  <path d="M448 470 L632 470" class="msg"/><text x="540" y="461" text-anchor="middle" class="small">Optional best-effort project</text>
  <path d="M448 516 L932 516" class="msg"/><text x="688" y="507" text-anchor="middle" class="small">Attempt notifications if configured</text>
  <path d="M447 555 L274 555" class="msg"/><text x="360" y="546" text-anchor="middle" class="small">Success / field errors</text>
  <text x="500" y="590" text-anchor="middle" class="small">* Email is configuration-dependent; project creation does not replace the persisted lead.</text>
</svg>
